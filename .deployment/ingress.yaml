apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: auth.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service-lb
            port:
              number: 80